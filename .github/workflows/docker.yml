name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  pull_request:

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: "Test"
    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Validate compose and scripts"
        run: "make test"

  build:
    name: "Build"
    needs: ["test"]
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
      image: "dockette/devstack"
      tag: "${{ matrix.tag }}"
      context: "${{ matrix.context }}"
      platforms: "${{ matrix.platforms }}"
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: apache
            context: apache
            platforms: linux/amd64,linux/arm64
          - tag: php85-fpm
            context: php/8.5-fpm
            platforms: linux/amd64,linux/arm64
          # the Dockerfile downloads the linux-x64 Node.js build
          - tag: nodejs
            context: nodejs
            platforms: linux/amd64

  docs:
    name: "Docs"
    needs: ["build"]
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/devstack"
